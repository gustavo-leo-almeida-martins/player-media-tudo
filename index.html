<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player IPTV</title>
<style>
/* ===== Variáveis (troque a cor principal em --cor-primaria) ===== */
:root{--cor-fundo:#0a0a0c;--cor-painel:#16161a;--cor-painel-2:#222228;--cor-borda:#2f2f37;--cor-texto:#f3f3f5;
  --cor-texto-2:#9a9aa6;--cor-primaria:#e50914;--cor-primaria-txt:#fff;--cor-erro:#ff6b6b;--cor-nav:rgba(10,10,12,.9);--raio:6px}
[data-theme=light]{--cor-fundo:#f4f4f6;--cor-painel:#fff;--cor-painel-2:#ececf0;--cor-borda:#d8d8e0;
  --cor-texto:#17171c;--cor-texto-2:#6a6a78;--cor-nav:rgba(244,244,246,.92)}
*{box-sizing:border-box;margin:0}
body{background:var(--cor-fundo);color:var(--cor-texto);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}button,label{cursor:pointer}
.btn{background:var(--cor-painel-2);border:1px solid var(--cor-borda);border-radius:var(--raio);padding:8px 14px;display:inline-block}
.btn:hover{border-color:var(--cor-primaria)}
.btn.pri{background:var(--cor-primaria);color:var(--cor-primaria-txt);border-color:transparent;font-weight:600}
input,select{width:100%;background:var(--cor-fundo);border:1px solid var(--cor-borda);border-radius:var(--raio);padding:8px 10px}
:focus-visible{outline:2px solid var(--cor-primaria);outline-offset:2px}

/* ===== Barra superior (abas e busca só aparecem com listas carregadas) ===== */
.nav{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding:12px 4vw;
  background:var(--cor-nav);backdrop-filter:blur(8px)}
.marca{color:var(--cor-primaria);font-weight:800;font-size:22px;letter-spacing:1px}
.abas{display:flex;gap:16px;overflow-x:auto;flex:1}
.abas button{background:none;border:0;color:var(--cor-texto-2);padding:6px 2px;white-space:nowrap}
.abas .on{color:var(--cor-texto);font-weight:700;box-shadow:0 2px var(--cor-primaria)}
#q{max-width:240px}
body.sem .abas,body.sem #q{display:none}
body.sem .nav{justify-content:space-between}

/* ===== Destaque (só com item que tenha imagem real) ===== */
.hero{position:relative;min-height:60vh;display:flex;align-items:flex-end;gap:30px;padding:60px 4vw 7vh;overflow:hidden;margin-top:-58px}
.hero .fundo{position:absolute;inset:-40px;width:calc(100% + 80px);height:calc(100% + 80px);object-fit:cover;filter:blur(30px) brightness(.55)}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--cor-fundo) 3%,transparent 65%)}
.hero .txt{position:relative;z-index:1;flex:1;max-width:560px;color:#fff;display:flex;flex-direction:column;gap:10px}
.hero h1{font-size:clamp(26px,5vw,48px);line-height:1.1}
.hero .poster{position:relative;z-index:1;height:44vh;border-radius:8px;box-shadow:0 10px 40px #0009;margin-left:auto}

/* ===== Filas e cartões ===== */
.sec{padding:16px 4vw 4px;font-size:18px}
.sec button{background:none;border:0;font:inherit;color:inherit}.sec small{color:var(--cor-texto-2)}
.secao{position:relative}
.fila{display:flex;gap:10px;overflow-x:auto;padding:6px 4vw 22px;scrollbar-width:none}
.seta{position:absolute;top:44px;bottom:28px;width:4vw;min-width:34px;z-index:2;border:0;color:#fff;font-size:28px;
  background:rgba(0,0,0,.55);opacity:0;transition:.2s}.seta.e{left:0}.seta.d{right:0}
.secao:hover .seta{opacity:1}
.card{flex:none;width:150px;cursor:pointer;transition:transform .18s;content-visibility:auto;contain-intrinsic-size:auto 240px}
.card.tv{width:230px;contain-intrinsic-size:auto 170px}
.card:hover{transform:scale(1.07);position:relative;z-index:1}
.cap{aspect-ratio:2/3;background:var(--cor-painel-2);border-radius:var(--raio);overflow:hidden;display:grid;place-items:center}
.tv .cap{aspect-ratio:16/9}.cap img{width:100%;height:100%;object-fit:cover}.tv .cap img{object-fit:contain;padding:12px}
/* item sem imagem: cartão só com o nome, sem ícone de enfeite */
.cap.sem{padding:10px;text-align:center;font-size:13px;font-weight:600;line-height:1.25;word-break:break-word;
  background:linear-gradient(135deg,var(--cor-painel-2),var(--cor-borda))}
.tit{font-size:12px;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--cor-texto-2)}
.card:hover .tit{color:var(--cor-texto)}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;padding:6px 4vw 30px}
.grade .card{width:auto}
.vazio{padding:12vh 4vw;text-align:center;color:var(--cor-texto-2);display:flex;flex-direction:column;align-items:center;gap:14px}
footer{padding:20px;text-align:center;font-size:12px;color:var(--cor-texto-2)}

/* ===== Diálogos ===== */
dialog{background:var(--cor-painel);color:var(--cor-texto);border:1px solid var(--cor-borda);border-radius:12px;padding:20px;width:min(560px,94vw);margin:auto}
dialog::backdrop{background:rgba(0,0,0,.78)}
dialog h2{margin-bottom:12px}
.linha{display:flex;gap:8px;margin:8px 0}.linha>*{min-width:0}
#aviso{font-size:12px;min-height:18px;margin:6px 0}#aviso.erro{color:var(--cor-erro)}#aviso.ok{color:#4cd37b}
#esp{font-size:12px;color:var(--cor-texto-2)}
dialog ul{list-style:none;max-height:40vh;overflow-y:auto;margin:8px 0}
dialog li{display:flex;justify-content:space-between;gap:10px;padding:8px;border-radius:var(--raio);cursor:pointer}
dialog li:hover{background:var(--cor-painel-2)}dialog li small{color:var(--cor-texto-2)}
dialog li button{background:none;border:0;color:var(--cor-erro)}
#ul li{cursor:default}

/* ===== Player em tela cheia ===== */
#dp{width:100vw;height:100vh;max-width:none;max-height:none;padding:0;border:0;border-radius:0;background:#000;color:#fff;position:fixed;inset:0}
#dp[open]{display:flex;flex-direction:column}
.topo{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#000}
.topo .t{flex:1;min-width:0}.topo b,.topo small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topo small{color:#aaa;font-size:12px}
#dp video{flex:1;min-height:0;width:100%;background:#000}
#overlay{position:absolute;inset:50px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:20px;text-align:center;background:rgba(0,0,0,.8);white-space:pre-line}
#overlay[hidden]{display:none}
@media(max-width:700px){.hero .poster{display:none}#q{max-width:none;flex:1}}
</style>
</head>
<body class="sem">

<nav class="nav">
  <span class="marca">IPTV</span>
  <div class="abas" id="abas">
    <button data-a="inicio">Início</button><button data-a="tv">TV ao vivo</button>
    <button data-a="filme">Filmes</button><button data-a="serie">Séries</button>
  </div>
  <input type="search" id="q" placeholder="Buscar…">
  <button class="btn" id="btnListas">Listas</button>
  <button class="btn" id="tema" title="Alternar tema">🌙</button>
</nav>

<div id="conteudo"></div>
<footer>Este player apenas reproduz listas M3U fornecidas pelo usuário. Use apenas conteúdo legal.</footer>

<!-- Gerenciador de listas -->
<dialog id="dl">
  <h2>Minhas listas</h2>
  <div class="linha">
    <select id="tipo"><option value="auto">Detectar tipo automaticamente</option><option value="tv">TV ao vivo</option>
      <option value="filme">Filmes</option><option value="serie">Séries</option></select>
    <input type="text" id="nome" placeholder="Nome (opcional)">
  </div>
  <div class="linha"><input type="text" id="url" placeholder="Link da lista M3U"><button class="btn pri" id="add">Adicionar</button></div>
  <label class="btn" for="arq">Enviar arquivo(s) .m3u / .m3u8</label>
  <input type="file" id="arq" multiple hidden accept=".m3u,.m3u8,audio/mpegurl,audio/x-mpegurl,application/vnd.apple.mpegurl,text/plain">
  <div id="aviso" role="status"></div>
  <ul id="ul"></ul>
  <div id="esp"></div>
  <div class="linha"><button class="btn" id="limpar">Limpar tudo</button><button class="btn pri" id="fx" style="margin-left:auto">Fechar</button></div>
</dialog>

<!-- Episódios de uma série -->
<dialog id="ds">
  <h2 id="sn"></h2>
  <select id="st"></select>
  <ul id="se"></ul>
  <button class="btn" id="fs">Fechar</button>
</dialog>

<!-- Player -->
<dialog id="dp">
  <div class="topo">
    <button class="btn" id="voltar">← Voltar</button>
    <div class="t"><b id="pn"></b><small id="pg"></small></div>
    <button class="btn" id="ant" title="Anterior (↑)">⏮</button><button class="btn" id="prox" title="Próximo (↓)">⏭</button>
  </div>
  <video id="video" controls playsinline></video>
  <div id="overlay"><p id="msg"></p><button class="btn pri" id="retry" hidden>Tentar novamente</button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const NOMES = {tv: 'TV ao vivo', filme: 'Filmes', serie: 'Séries', auto: 'Automático'};
const K = {listas: 'iptv.listas', antigo: 'iptv.canais', tema: 'iptv.tema'};
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };

/* ===== Estado ===== */
let listas = [];                          // [{nome, tipo, c: [{n,l,g,u,t}]}]
let cat = {tv: [], filme: [], serie: []}; // itens por tipo (séries já agrupadas por título)
let aba = 'inicio', gSel = '', lim = 800; // aba, grupo selecionado, limite da grade
let reg = [], lista = [], hero = null;
let ctx = [], pos = -1;                   // fila de reprodução (anterior/próximo)
let hls = null, nativo = false, tent = 0, timer = null, serAtual = null, serEps = [];

/* ===================================================================
   ARMAZENAMENTO: IndexedDB (centenas de MB, em vez dos ~5 MB do
   localStorage). Se o IndexedDB falhar, usa o localStorage como plano B.
   =================================================================== */
let dbp = null;
const db = () => dbp || (dbp = new Promise((ok, no) => {
  const r = indexedDB.open('iptv', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
}));
const idbGet = async k => { const d = await db(); return new Promise((ok, no) => {
  const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); }); };
const idbSet = async (k, v) => { const d = await db(); return new Promise((ok, no) => {
  const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k);
  t.oncomplete = ok; t.onerror = t.onabort = () => no(t.error); }); };

async function salvar() {                 // retorna 'idb', 'ls' ou false
  try { await idbSet('listas', listas); return 'idb'; } catch {}
  return lsSet(K.listas, JSON.stringify(listas)) ? 'ls' : false;
}
async function espaco() {                 // mostra quanto do armazenamento está em uso
  try {
    const e = await navigator.storage.estimate();
    $('esp').textContent = 'Armazenamento: ' + (e.usage / 1048576).toFixed(1) + ' MB usados de ' + Math.round(e.quota / 1048576) + ' MB disponíveis';
  } catch {}
}

/* ===================================================================
   PARSER M3U (nome, logo, grupo, url + tipo do conteúdo)
   =================================================================== */
const detectar = i =>
  /\/series\//i.test(i.u) || /s[ée]ries?\b/i.test(i.g) || /\bS\d{1,2}\s*E\d{1,3}\b/i.test(i.n) ? 'serie'
  : /\/movie\//i.test(i.u) || /filme|movie|vod|cine/i.test(i.g) || /\.mp4(\?|$)/i.test(i.u) ? 'filme' : 'tv';

function parseM3U(texto, tipo) {
  const out = [];
  let meta = null;
  for (const bruto of texto.replace(/^\uFEFF/, '').split(/\r?\n/)) {
    const l = bruto.trim();
    if (!l) continue;
    if (/^#EXTINF/i.test(l)) {
      const attr = k => (l.match(new RegExp(k + '="([^"]*)"', 'i')) || [])[1] || '';
      const depois = l.replace(/"[^"]*"/g, '').split(',').slice(1).join(',').trim();
      const logo = attr('tvg-logo').trim();
      meta = {n: (attr('tvg-name') || depois).trim(),
              l: /^(https?:|data:image)/i.test(logo) ? logo : '',
              g: attr('group-title').trim() || 'Sem grupo'};
    } else if (l[0] !== '#') {
      if (/^https?:\/\//i.test(l)) {
        const m = meta || {l: '', g: 'Sem grupo'};
        const it = {n: m.n || 'Item ' + (out.length + 1), l: m.l, g: m.g, u: l.split('|')[0]};
        it.t = tipo && tipo !== 'auto' ? tipo : detectar(it);
        out.push(it);
      }
      meta = null;
    }
  }
  return out;
}

/* Monta o catálogo: agrupa episódios (ex.: "Nome S01E02") em séries */
function reconstruir() {
  cat = {tv: [], filme: [], serie: []};
  const mapa = new Map();
  for (const li of listas) for (const i of li.c) {
    if (i.t !== 'serie') { cat[i.t].push(i); continue; }
    const m = i.n.match(/^(.*?)[\s._-]*S(\d{1,2})\s*[._-]?\s*E(\d{1,3})/i);
    const nome = (m && m[1].trim()) || i.n;
    let s = mapa.get(nome.toLowerCase());
    if (!s) { s = {n: nome, l: i.l, g: i.g, t: 'serie', eps: []}; mapa.set(nome.toLowerCase(), s); cat.serie.push(s); }
    if (!s.l && i.l) s.l = i.l;
    const ss = m ? +m[2] : 1, e = m ? +m[3] : s.eps.length + 1;
    s.eps.push({n: nome + ' · T' + ss + 'E' + e, r: i.n, u: i.u, l: s.l, g: nome, t: 'serie', s: ss, e});
  }
  hero = null;
}

/* ===================================================================
   INTERFACE
   =================================================================== */
// Cartão: com imagem real mostra a capa + nome; sem imagem mostra só o nome
const card = i => '<div class="card ' + i.t + '" data-i="' + (reg.push(i) - 1) + '" title="' + esc(i.n) + '">' +
  (i.l ? '<div class="cap"><img loading="lazy" alt="' + esc(i.n) + '" src="' + esc(i.l) + '"></div><div class="tit">' + esc(i.n) + '</div>'
       : '<div class="cap sem">' + esc(i.n) + '</div>') + '</div>';

// Imagem quebrada: o cartão vira só texto (nada de ícone genérico)
document.addEventListener('error', e => {
  const im = e.target;
  if (im.tagName !== 'IMG') return;
  const p = im.parentElement;
  if (p.classList.contains('cap')) { p.classList.add('sem'); p.textContent = im.alt; if (p.nextElementSibling) p.nextElementSibling.remove(); }
  else im.remove();
}, true);

const fila = (titulo, arr, acao) =>
  '<section class="secao"><h3 class="sec"><button data-r="' + esc(acao) + '">' + esc(titulo) + ' ›</button> <small>' + arr.length +
  '</small></h3><button class="seta e">‹</button><div class="fila">' + arr.slice(0, 40).map(card).join('') +
  '</div><button class="seta d">›</button></section>';

function render() {
  reg = [];
  document.body.classList.toggle('sem', !listas.length);   // visual de streaming só com listas carregadas
  if (aba !== 'inicio' && !cat[aba].length) aba = 'inicio';
  document.querySelectorAll('#abas button').forEach(b => {   // esconde abas de tipos sem conteúdo
    const a = b.dataset.a; b.hidden = a !== 'inicio' && !cat[a].length; b.classList.toggle('on', a === aba);
  });
  const q = $('q').value.trim().toLowerCase();
  const base = aba === 'inicio' ? [...cat.filme, ...cat.serie, ...cat.tv] : cat[aba];
  lista = base.filter(i => (!q || i.n.toLowerCase().includes(q)) && (!gSel || i.g === gSel));
  let h = '';
  if (!listas.length) {
    h = '<div class="vazio"><p>Nenhuma lista carregada.</p><button class="btn pri" data-add>Adicionar lista</button></div>';
  } else if (q || gSel) {
    h = '<h3 class="sec">' + (gSel ? '<button data-v>‹ Voltar</button> ' + esc(gSel) : 'Resultados') + ' <small>' + lista.length + ' itens</small></h3>' +
        '<div class="grade">' + lista.slice(0, lim).map(card).join('') + '</div>' +
        (lista.length > lim ? '<div class="vazio" style="padding:0 0 30px"><button class="btn" data-more>Mostrar mais</button></div>' : '');
  } else if (!lista.length) {
    h = '<div class="vazio"><p>Nada por aqui ainda.</p></div>';
  } else {
    if (aba === 'inicio') {
      // destaque só se houver filme/série com imagem real
      if (!hero) { const pool = base.filter(x => x.l && x.t !== 'tv'); hero = pool[Math.random() * pool.length | 0] || null; }
      if (hero) h += '<section class="hero"><img class="fundo" alt="" src="' + esc(hero.l) + '"><div class="txt"><small>' + NOMES[hero.t] +
        '</small><h1>' + esc(hero.n) + '</h1><p>' + esc(hero.g) + '</p><div><button class="btn pri" data-play>▶ ' +
        (hero.t === 'serie' ? 'Ver episódios' : 'Assistir') + '</button></div></div><img class="poster" alt="" src="' + esc(hero.l) + '"></section>';
      for (const t of ['filme', 'serie', 'tv']) if (cat[t].length) h += fila(NOMES[t], cat[t], t);
    } else {
      const gr = new Map();
      lista.forEach(i => { if (!gr.has(i.g)) gr.set(i.g, []); gr.get(i.g).push(i); });
      [...gr].sort((a, b) => a[0].localeCompare(b[0])).slice(0, 40).forEach(([g, arr]) => h += fila(g, arr, g));
    }
  }
  $('conteudo').innerHTML = h;
}

$('conteudo').addEventListener('click', e => {
  const t = e.target, c = t.closest('.card');
  if (c) return abrir(reg[+c.dataset.i]);
  if (t.closest('[data-play]')) return abrir(hero);
  if (t.closest('[data-add]')) return $('btnListas').click();
  if (t.closest('[data-more]')) { lim += 800; return render(); }
  if (t.closest('[data-v]')) { gSel = ''; lim = 800; return render(); }
  const r = t.closest('[data-r]');
  if (r) { aba === 'inicio' ? aba = r.dataset.r : gSel = r.dataset.r; lim = 800; render(); return scrollTo(0, 0); }
  const s = t.closest('.seta');
  if (s) { const f = s.parentElement.querySelector('.fila'); f.scrollBy({left: (s.classList.contains('e') ? -1 : 1) * f.clientWidth * .8, behavior: 'smooth'}); }
});
$('abas').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { aba = b.dataset.a; gSel = ''; lim = 800; render(); } });
let deb; $('q').addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(() => { lim = 800; render(); }, 200); });

/* ===================================================================
   LISTAS: adicionar (arquivo ou link), remover, salvar
   =================================================================== */
const aviso = (t, c) => { $('aviso').textContent = t; $('aviso').className = c || ''; };

function renderListas() {
  $('ul').innerHTML = listas.map((l, i) => '<li><span>' + esc(l.nome) + ' <small>· ' + l.c.length + ' itens · ' + NOMES[l.tipo] +
    '</small></span><button data-x="' + i + '" title="Remover">✕</button></li>').join('') || '<li><small>Nenhuma lista ainda.</small></li>';
}
async function atualizar(msg, cls) {
  const ok = await salvar();
  reconstruir(); renderListas(); gSel = ''; lim = 800; render(); espaco();
  aviso(msg + (ok ? '' : ' (não foi possível salvar no navegador: some ao recarregar)'), cls);
}
// Adiciona (ou substitui, se o nome já existir) uma lista
function adicionar(nome, texto) {
  const tipo = $('tipo').value, c = parseM3U(texto, tipo);
  if (!c.length) { aviso('"' + nome + '": lista inválida ou vazia.', 'erro'); return false; }
  listas = listas.filter(l => l.nome !== nome);
  listas.push({nome, tipo, c});
  return true;
}

$('arq').addEventListener('change', async e => {
  const fs = [...e.target.files]; e.target.value = '';
  let n = 0;
  for (const f of fs) {
    try { if (adicionar($('nome').value.trim() && fs.length === 1 ? $('nome').value.trim() : f.name.replace(/\.[^.]+$/, ''), await f.text())) n++; }
    catch { aviso('Não foi possível ler "' + f.name + '".', 'erro'); }
  }
  if (n) atualizar(n + ' lista(s) adicionada(s).', 'ok');
});

async function addUrl() {
  const u = $('url').value.trim();
  if (!/^https?:\/\//i.test(u)) return aviso('Informe um link http(s) válido.', 'erro');
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 20000);
  aviso('Baixando lista…', 'ok');
  try {
    const r = await fetch(u, {signal: ctl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    let host = u; try { host = new URL(u).hostname; } catch {}
    if (adicionar($('nome').value.trim() || host, await r.text())) { atualizar('Lista adicionada.', 'ok'); $('url').value = ''; $('nome').value = ''; }
  } catch (e) {
    const m = e.name === 'AbortError' ? 'tempo esgotado' : /^HTTP/.test(e.message) ? 'erro ' + e.message : 'bloqueio de CORS, link fora do ar ou HTTP em página HTTPS';
    aviso('Falha ao baixar (' + m + '). Baixe o arquivo e use o envio por arquivo.', 'erro');
  } finally { clearTimeout(t); }
}
$('add').onclick = addUrl;
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') addUrl(); });
$('ul').addEventListener('click', e => {
  const b = e.target.closest('[data-x]');
  if (b) { listas.splice(+b.dataset.x, 1); atualizar('Lista removida.', 'ok'); }
});
$('limpar').onclick = () => { if (listas.length && confirm('Remover todas as listas?')) { listas = []; atualizar('Tudo removido.', 'ok'); } };
$('btnListas').onclick = () => { renderListas(); aviso(''); espaco(); $('dl').showModal(); };
$('fx').onclick = () => $('dl').close();

/* ===================================================================
   SÉRIES: escolha de temporada e episódio
   =================================================================== */
function abrirSerie(s) {
  serAtual = s;
  const ts = [...new Set(s.eps.map(e => e.s))].sort((a, b) => a - b);
  $('sn').textContent = s.n;
  $('st').innerHTML = ts.map(t => '<option value="' + t + '">Temporada ' + t + '</option>').join('');
  episodios(); $('ds').showModal();
}
function episodios() {
  const t = +$('st').value;
  serEps = serAtual.eps.filter(e => e.s === t).sort((a, b) => a.e - b.e);
  $('se').innerHTML = serEps.map((e, i) => '<li data-p="' + i + '"><span>' + esc(e.r) + '</span><small>Ep. ' + e.e + '</small></li>').join('');
}
$('st').onchange = episodios;
$('se').addEventListener('click', e => { const li = e.target.closest('li'); if (li) { $('ds').close(); tocar(serEps, +li.dataset.p); } });
$('fs').onclick = () => $('ds').close();

/* ===================================================================
   PLAYER
   =================================================================== */
const mostrar = (t, retry) => { $('msg').textContent = t; $('retry').hidden = !retry; $('overlay').hidden = false; };

// Libera o canal anterior (destrói o Hls.js para não vazar memória)
function limparPlayer() {
  clearTimeout(timer);
  if (hls) { hls.destroy(); hls = null; }
  const v = $('video'); v.pause(); v.removeAttribute('src'); v.load();
}
function erro() {
  limparPlayer();
  let m = 'Não foi possível carregar este conteúdo. Tente outro.';
  if (location.protocol === 'https:' && ctx[pos] && /^http:/i.test(ctx[pos].u)) m += '\n(Link em HTTP e site em HTTPS: o navegador bloqueia.)';
  mostrar(m, true);
}

// Abre um item (filme/canal toca direto; série abre a lista de episódios)
function abrir(it) {
  if (!it) return;
  if (it.t === 'serie') return abrirSerie(it);
  const arr = it.t === 'tv' ? lista.filter(x => x.t === 'tv' && x.g === it.g) : [it];
  tocar(arr, Math.max(0, arr.indexOf(it)));
}
// Troca de canal/episódio
function tocar(arr, p) {
  ctx = arr; pos = p;
  const it = ctx[pos];
  $('pn').textContent = it.n; $('pg').textContent = it.g;
  $('ant').hidden = $('prox').hidden = ctx.length < 2;
  if (!$('dp').open) $('dp').showModal();
  iniciar(it.u);
}

// Inicialização do HLS: nativo (Safari) ou Hls.js
function iniciar(url) {
  const v = $('video'); tent = 0;
  limparPlayer(); mostrar('Carregando…');
  try {
    const simples = /\.(mp4|webm|ogv|mp3|aac|m4a|mkv|avi|mov)(\?|#|$)/i.test(url);
    nativo = !!v.canPlayType('application/vnd.apple.mpegurl') || simples;
    if (nativo) { v.src = url; v.play().catch(() => {}); }
    else {
      if (typeof Hls === 'undefined' || !Hls.isSupported()) return erro();
      hls = new Hls({enableWorker: true, maxBufferLength: 30});
      hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(() => {}));
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR && tent++ < 2) hls.startLoad();
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && tent++ < 2) hls.recoverMediaError();
        else erro();
      });
      hls.attachMedia(v); hls.loadSource(url);
    }
    timer = setTimeout(erro, 30000);
  } catch { erro(); }
}
$('video').addEventListener('playing', () => { clearTimeout(timer); $('overlay').hidden = true; });
$('video').addEventListener('error', () => { if (nativo && $('dp').open) erro(); });
$('retry').onclick = () => { if (ctx[pos]) iniciar(ctx[pos].u); };
$('voltar').onclick = () => $('dp').close();
$('dp').addEventListener('close', () => { limparPlayer(); mostrar(''); });

function mover(d) { if (ctx.length > 1) tocar(ctx, (pos + d + ctx.length) % ctx.length); }
$('ant').onclick = () => mover(-1);
$('prox').onclick = () => mover(1);

// Atalhos (só com o player aberto): ↑/↓ troca, ←/→ pula 10s, espaço = play/pause
document.addEventListener('keydown', e => {
  if (!$('dp').open || /INPUT|SELECT/.test(e.target.tagName)) return;
  const v = $('video'), t = e.target.tagName;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); mover(e.key === 'ArrowDown' ? 1 : -1); }
  else if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && t !== 'VIDEO' && isFinite(v.duration)) { e.preventDefault(); v.currentTime += e.key === 'ArrowRight' ? 10 : -10; }
  else if (e.key === ' ' && !/BUTTON|VIDEO/.test(t)) { e.preventDefault(); v.paused ? v.play().catch(() => {}) : v.pause(); }
});

/* ===== Tema ===== */
function aplicarTema(t) { document.documentElement.dataset.theme = t; $('tema').textContent = t === 'dark' ? '🌙' : '☀️'; }
$('tema').onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; aplicarTema(t); lsSet(K.tema, t); };

/* ===== Inicialização ===== */
(async () => {
  aplicarTema(lsGet(K.tema) || 'dark');
  try { navigator.storage.persist(); } catch {}      // pede ao navegador para não apagar os dados
  let l = null;
  try { l = await idbGet('listas'); } catch {}
  if (Array.isArray(l)) listas = l;
  else {                                               // migra o que as versões anteriores salvaram no localStorage
    try { l = JSON.parse(lsGet(K.listas) || 'null'); } catch { l = null; }
    if (!Array.isArray(l)) {
      try { const v = JSON.parse(lsGet(K.antigo) || '[]'); l = v.length ? [{nome: 'Minha lista', tipo: 'auto', c: v.map(i => ({...i, t: detectar(i)}))}] : []; }
      catch { l = []; }
    }
    listas = l;
    if (listas.length && await salvar() === 'idb') { try { localStorage.removeItem(K.listas); localStorage.removeItem(K.antigo); } catch {} }
  }
  reconstruir(); render();
  if (!listas.length) { renderListas(); espaco(); $('dl').showModal(); }
})();
})();
</script>
