<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Player IPTV</title>
<style>
/* ===== Variáveis de tema (edite aqui para personalizar) ===== */
:root{
  --cor-fundo:#0b0f14; --cor-painel:#131a22; --cor-painel-2:#1b2530; --cor-borda:#26323f;
  --cor-texto:#e8eef5; --cor-texto-2:#8fa0b3;
  --cor-primaria:#1ed760; --cor-primaria-txt:#04130a; --cor-erro:#ff5d5d;
  --raio:10px; --larg-lista:340px;
}
[data-theme=light]{
  --cor-fundo:#f2f5f8; --cor-painel:#ffffff; --cor-painel-2:#e9eef3; --cor-borda:#d5dde6;
  --cor-texto:#12202e; --cor-texto-2:#5d6f82; --cor-primaria:#0a9f4a; --cor-primaria-txt:#ffffff;
}

/* ===== Base ===== */
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--cor-fundo);color:var(--cor-texto);display:flex;flex-direction:column;
  font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
button,label.btn{cursor:pointer}
.btn{background:var(--cor-painel-2);border:1px solid var(--cor-borda);border-radius:8px;padding:8px 12px;transition:.15s}
.btn:hover{border-color:var(--cor-primaria)}
.btn.pri{background:var(--cor-primaria);color:var(--cor-primaria-txt);border-color:transparent;font-weight:600}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cor-primaria);outline-offset:1px}
input[type=text],input[type=search],select{width:100%;background:var(--cor-fundo);
  border:1px solid var(--cor-borda);border-radius:8px;padding:8px 10px}

/* ===== Cabeçalho e layout ===== */
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--cor-painel);border-bottom:1px solid var(--cor-borda)}
header h1{font-size:18px;flex:1}
header h1 span{color:var(--cor-primaria)}
#menu{display:none}
.app{flex:1;min-height:0;display:flex;position:relative}

/* ===== Barra lateral ===== */
aside{width:var(--larg-lista);background:var(--cor-painel);border-right:1px solid var(--cor-borda);display:flex;flex-direction:column;min-height:0}
.bloco{padding:12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--cor-borda)}
.linha{display:flex;gap:6px}
.linha>*{min-width:0}
#aviso{display:none;font-size:12px;padding:8px 10px;border-radius:8px;background:var(--cor-painel-2)}
#aviso.erro{display:block;color:var(--cor-erro)}
#aviso.ok{display:block;color:var(--cor-primaria)}
#contador{font-size:12px;color:var(--cor-texto-2)}
#lista{flex:1;overflow-y:auto;list-style:none;padding:6px}
#lista li{content-visibility:auto;contain-intrinsic-size:auto 52px;display:flex;align-items:center;gap:10px;
  padding:8px;border-radius:8px;cursor:pointer;border-left:3px solid transparent}
#lista li:hover{background:var(--cor-painel-2)}
#lista li.ativo{background:var(--cor-painel-2);border-left-color:var(--cor-primaria)}
#lista li.ativo .nome{color:var(--cor-primaria)}
.logo{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:6px;background:var(--cor-fundo);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.info{min-width:0}
.nome,.grupo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nome{font-weight:600}
.grupo{font-size:12px;color:var(--cor-texto-2)}

/* ===== Área do player ===== */
main{flex:1;min-width:0;display:flex;flex-direction:column;gap:12px;padding:14px;overflow-y:auto}
.atual{display:flex;align-items:center;gap:12px}
.atual .logo{width:48px;height:48px}
.atual .info{flex:1}
.atual h2{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atual p{font-size:12px;color:var(--cor-texto-2)}
.palco{position:relative;flex:none;width:100%;aspect-ratio:16/9;max-height:calc(100vh - 190px);
  background:#000;border:1px solid var(--cor-borda);border-radius:var(--raio);overflow:hidden}
video{width:100%;height:100%;display:block;background:#000}
#overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:12px;padding:20px;text-align:center;background:rgba(0,0,0,.78);color:#fff;white-space:pre-line}
#overlay[hidden]{display:none}
footer{padding:8px;text-align:center;font-size:12px;color:var(--cor-texto-2);background:var(--cor-painel);border-top:1px solid var(--cor-borda)}

/* ===== Responsivo: lista vira painel colapsável ===== */
@media (max-width:800px){
  #menu{display:inline-block}
  aside{position:absolute;top:0;bottom:0;left:0;width:min(88vw,360px);z-index:10;
    transform:translateX(-100%);transition:transform .2s}
  aside.aberto{transform:none;box-shadow:0 0 40px rgba(0,0,0,.6)}
}
</style>
</head>
<body>

<header>
  <button class="btn" id="menu" aria-label="Abrir ou fechar a lista de canais">☰</button>
  <h1><span>▶</span> Player IPTV</h1>
  <button class="btn" id="tema" title="Alternar tema claro/escuro">🌙</button>
</header>

<div class="app">
  <aside id="lateral">
    <div class="bloco">
      <div class="linha">
        <label class="btn pri" for="arquivo" style="flex:1;text-align:center">📂 Enviar .m3u / .m3u8</label>
        <input type="file" id="arquivo" accept=".m3u,.m3u8,audio/mpegurl,audio/x-mpegurl,application/vnd.apple.mpegurl,text/plain" hidden>
        <button class="btn" id="limpar">Limpar lista</button>
      </div>
      <div class="linha">
        <input type="text" id="url" placeholder="Cole o link da lista M3U" autocomplete="off">
        <button class="btn" id="carregar">Carregar</button>
      </div>
      <div id="aviso" role="status"></div>
    </div>
    <div class="bloco">
      <input type="search" id="busca" placeholder="Buscar canal…">
      <select id="grupo" aria-label="Filtrar por grupo"></select>
      <div id="contador">0 canais</div>
    </div>
    <ul id="lista"></ul>
  </aside>

  <main>
    <div class="atual">
      <div class="logo" id="logoAtual">📺</div>
      <div class="info"><h2 id="nomeAtual">Nenhum canal</h2><p id="grupoAtual"></p></div>
      <button class="btn" id="ant" title="Canal anterior (↑)">⏮ Anterior</button>
      <button class="btn" id="prox" title="Próximo canal (↓)">Próximo ⏭</button>
    </div>
    <div class="palco">
      <video id="video" controls playsinline></video>
      <div id="overlay">
        <p id="msg"></p>
        <button class="btn pri" id="retry" hidden>Tentar novamente</button>
      </div>
    </div>
  </main>
</div>

<footer>Este player apenas reproduz listas M3U fornecidas pelo usuário. Use apenas conteúdo legal.</footer>

<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script>
(() => {
'use strict';

/* ===== Referências do DOM ===== */
const el = {};
['menu','tema','lateral','arquivo','limpar','url','carregar','aviso','busca','grupo','contador','lista',
 'logoAtual','nomeAtual','grupoAtual','ant','prox','video','overlay','msg','retry']
  .forEach(id => el[id] = document.getElementById(id));

/* ===== Estado ===== */
let canais = [];    // todos os canais: {n: nome, l: logo, g: grupo, u: url}
let vista = [];     // índices (em canais) dos itens visíveis após busca/filtro
let atual = -1;     // índice do canal em reprodução
let hls = null;     // instância atual do Hls.js
let nativo = false; // true quando o <video> toca o HLS direto (Safari)
let tentativas = 0, timer = null;

/* ===== localStorage seguro (pode falhar em modo privado/cota cheia) ===== */
const K = {lista:'iptv.canais', url:'iptv.url', tema:'iptv.tema'};
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); return true; } catch { return false; } };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };

const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
const aviso = (t, tipo) => { el.aviso.textContent = t; el.aviso.className = tipo || ''; };

/* ===================================================================
   PARSER M3U
   Extrai nome (tvg-name ou texto após a vírgula), logo, grupo e URL.
   Linhas inválidas e entradas sem URL são ignoradas.
   =================================================================== */
function parseM3U(texto) {
  const out = [];
  let meta = null;
  for (const bruto of texto.replace(/^\uFEFF/, '').split(/\r?\n/)) {
    const l = bruto.trim();
    if (!l) continue;
    if (/^#EXTINF/i.test(l)) {
      const attr = k => (l.match(new RegExp(k + '="([^"]*)"', 'i')) || [])[1] || '';
      // remove os trechos entre aspas para achar a vírgula que separa o nome
      const depois = l.replace(/"[^"]*"/g, '').split(',').slice(1).join(',').trim();
      const logo = attr('tvg-logo').trim();
      meta = {
        n: (attr('tvg-name') || depois).trim(),
        l: /^(https?:|data:image)/i.test(logo) ? logo : '',
        g: attr('group-title').trim() || 'Sem grupo'
      };
    } else if (l[0] !== '#') {
      if (/^https?:\/\//i.test(l)) {
        const m = meta || {l: '', g: 'Sem grupo'};
        out.push({
          n: m.n || 'Canal ' + (out.length + 1),
          l: m.l, g: m.g,
          u: l.split('|')[0]        // descarta sufixo de headers estilo Kodi (|User-Agent=...)
        });
      }
      meta = null;
    }
  }
  return out;
}

/* ===== Carregar lista: por arquivo ou por link ===== */
function aplicar(texto) {
  const lista = parseM3U(texto);
  if (!lista.length) { aviso('Lista inválida ou vazia: nenhum canal com URL foi encontrado.', 'erro'); return false; }
  canais = lista;
  const salvo = lsSet(K.lista, JSON.stringify(canais));
  el.busca.value = '';
  resetAtual('Escolha um canal na lista.');
  renderGrupos(); filtrar();
  aviso(lista.length + ' canais carregados' + (salvo ? '.' : ' (grande demais para salvar no navegador).'), 'ok');
  el.lateral.classList.remove('aberto');
  return true;
}

el.arquivo.addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => aplicar(String(r.result));
  r.onerror = () => aviso('Não foi possível ler o arquivo.', 'erro');
  r.readAsText(f);
  e.target.value = '';
});

async function carregarUrl() {
  const u = el.url.value.trim();
  if (!/^https?:\/\//i.test(u)) return aviso('Informe um link http(s) válido.', 'erro');
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), 20000);
  aviso('Baixando lista…', 'ok');
  try {
    const r = await fetch(u, {signal: ctl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    if (aplicar(await r.text())) lsSet(K.url, u);
  } catch (e) {
    const motivo = e.name === 'AbortError' ? 'tempo esgotado'
      : /^HTTP/.test(e.message) ? 'erro ' + e.message
      : 'bloqueio de CORS, link fora do ar ou HTTP em página HTTPS';
    aviso('Falha ao baixar a lista (' + motivo + '). Tente baixar o arquivo e usar o botão de upload.', 'erro');
  } finally { clearTimeout(t); }
}
el.carregar.onclick = carregarUrl;
el.url.addEventListener('keydown', e => { if (e.key === 'Enter') carregarUrl(); });

el.limpar.onclick = () => {
  if (canais.length && !confirm('Remover a lista salva?')) return;
  canais = []; vista = [];
  lsDel(K.lista); lsDel(K.url); el.url.value = ''; el.busca.value = '';
  resetAtual('Carregue uma lista M3U para começar.');
  renderGrupos(); filtrar();
  aviso('Lista removida.', 'ok');
};

/* ===== Lista, busca e filtro ===== */
const logoHTML = l => '<span class="logo">' + (l ? '<img loading="lazy" alt="" src="' + esc(l) + '">' : '📺') + '</span>';
// se a imagem do logo falhar, troca por um ícone
document.addEventListener('error', e => { if (e.target.tagName === 'IMG') e.target.replaceWith('📺'); }, true);

function renderGrupos() {
  const gs = [...new Set(canais.map(c => c.g))].sort((a, b) => a.localeCompare(b));
  el.grupo.innerHTML = '<option value="">Todos os grupos (' + gs.length + ')</option>' +
    gs.map(g => '<option>' + esc(g) + '</option>').join('');
}

function filtrar() {
  const q = el.busca.value.trim().toLowerCase(), g = el.grupo.value;
  vista = [];
  canais.forEach((c, i) => { if ((!g || c.g === g) && (!q || c.n.toLowerCase().includes(q))) vista.push(i); });
  el.lista.innerHTML = vista.map(i => {
    const c = canais[i];
    return '<li data-i="' + i + '"' + (i === atual ? ' class="ativo"' : '') + '>' + logoHTML(c.l) +
      '<div class="info"><div class="nome">' + esc(c.n) + '</div><div class="grupo">' + esc(c.g) + '</div></div></li>';
  }).join('');
  el.contador.textContent = vista.length === canais.length
    ? canais.length + ' canais' : vista.length + ' de ' + canais.length + ' canais';
}

let deb;
el.busca.addEventListener('input', () => { clearTimeout(deb); deb = setTimeout(filtrar, 150); });
el.grupo.addEventListener('change', filtrar);
el.lista.addEventListener('click', e => {
  const li = e.target.closest('li');
  if (!li) return;
  tocar(+li.dataset.i);
  el.lateral.classList.remove('aberto');
});

/* ===================================================================
   PLAYER
   =================================================================== */
const mostrar = (t, retry) => { el.msg.textContent = t; el.retry.hidden = !retry; el.overlay.hidden = false; };

// Libera tudo do canal anterior (destrói o Hls.js para não vazar memória)
function limparPlayer() {
  clearTimeout(timer);
  if (hls) { hls.destroy(); hls = null; }
  el.video.pause();
  el.video.removeAttribute('src');
  el.video.load();
}

function resetAtual(msg) {
  limparPlayer();
  atual = -1;
  el.nomeAtual.textContent = 'Nenhum canal';
  el.grupoAtual.textContent = '';
  el.logoAtual.textContent = '📺';
  mostrar(msg);
}

function erro() {
  limparPlayer();
  let m = 'Não foi possível carregar este canal. Tente outro.';
  if (location.protocol === 'https:' && /^http:/i.test(canais[atual] ? canais[atual].u : ''))
    m += '\n(Este canal usa HTTP e o site está em HTTPS: o navegador bloqueia.)';
  mostrar(m, true);
}

// Troca de canal: atualiza interface e inicia a reprodução
function tocar(i) {
  const c = canais[i];
  if (!c) return;
  atual = i;
  el.nomeAtual.textContent = c.n;
  el.grupoAtual.textContent = c.g;
  el.logoAtual.innerHTML = c.l ? '<img alt="" src="' + esc(c.l) + '">' : '📺';
  const ativo = el.lista.querySelector('.ativo');
  if (ativo) ativo.classList.remove('ativo');
  const li = el.lista.querySelector('[data-i="' + i + '"]');
  if (li) { li.classList.add('ativo'); li.scrollIntoView({block: 'nearest'}); }
  iniciar();
}

// Inicialização do HLS: nativo (Safari) ou Hls.js
function iniciar() {
  const url = canais[atual].u;
  tentativas = 0;
  limparPlayer();
  mostrar('Carregando…');
  try {
    const arquivoSimples = /\.(mp4|webm|ogv|mp3|aac|m4a)(\?|#|$)/i.test(url);
    const hlsNativo = el.video.canPlayType('application/vnd.apple.mpegurl');
    nativo = !!hlsNativo || arquivoSimples;

    if (nativo) {
      el.video.src = url;
      el.video.play().catch(() => {});
    } else {
      if (typeof Hls === 'undefined' || !Hls.isSupported()) return erro();
      hls = new Hls({enableWorker: true, maxBufferLength: 30});
      hls.on(Hls.Events.MANIFEST_PARSED, () => el.video.play().catch(() => {}));
      hls.on(Hls.Events.ERROR, (_, d) => {
        if (!d.fatal) return;
        if (d.type === Hls.ErrorTypes.NETWORK_ERROR && tentativas++ < 2) hls.startLoad();
        else if (d.type === Hls.ErrorTypes.MEDIA_ERROR && tentativas++ < 2) hls.recoverMediaError();
        else erro();
      });
      hls.attachMedia(el.video);
      hls.loadSource(url);
    }
    timer = setTimeout(erro, 25000);   // se nada tocar em 25s, considera falha
  } catch (e) { erro(); }
}

el.video.addEventListener('playing', () => { clearTimeout(timer); el.overlay.hidden = true; });
el.video.addEventListener('error', () => { if (nativo && atual >= 0) erro(); });
el.retry.onclick = () => { if (atual >= 0) iniciar(); };

/* ===== Anterior / próximo (dentro da lista filtrada) ===== */
function mover(d) {
  if (!vista.length) return;
  const p = vista.indexOf(atual);
  const n = p < 0 ? (d > 0 ? 0 : vista.length - 1) : (p + d + vista.length) % vista.length;
  tocar(vista[n]);
}
el.ant.onclick = () => mover(-1);
el.prox.onclick = () => mover(1);

/* ===== Atalhos: ↑/↓ trocam de canal, espaço = play/pause ===== */
document.addEventListener('keydown', e => {
  const t = e.target.tagName;
  if (/INPUT|SELECT|TEXTAREA/.test(t)) return;
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    mover(e.key === 'ArrowDown' ? 1 : -1);
  } else if (e.key === ' ' && !/BUTTON|VIDEO/.test(t)) {
    e.preventDefault();
    el.video.paused ? el.video.play().catch(() => {}) : el.video.pause();
  }
});

/* ===== Tema e menu ===== */
function aplicarTema(t) {
  document.documentElement.dataset.theme = t;
  el.tema.textContent = t === 'dark' ? '🌙' : '☀️';
}
el.tema.onclick = () => {
  const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
  aplicarTema(t); lsSet(K.tema, t);
};
el.menu.onclick = () => el.lateral.classList.toggle('aberto');

/* ===== Inicialização: restaura a lista salva ===== */
aplicarTema(lsGet(K.tema) || 'dark');
try { canais = JSON.parse(lsGet(K.lista) || '[]'); } catch { canais = []; }
if (!Array.isArray(canais)) canais = [];
el.url.value = lsGet(K.url) || '';
renderGrupos(); filtrar();
mostrar(canais.length ? 'Escolha um canal na lista.' : 'Carregue uma lista M3U para começar.');
if (!canais.length) el.lateral.classList.add('aberto');   // no celular, abre o painel
})();
</script>
</body>
</html>
